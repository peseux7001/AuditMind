services:
  web:
    image: nginx:alpine
    container_name: auditmind-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: auditmind-api
    restart: unless-stopped
    working_dir: /workspace
    command: sh -c "npm install --omit=dev && node backend/api/server.mjs"
    environment:
      AUDITMIND_API_PORT: 4174
      AUDITMIND_DB_HOST: db
      AUDITMIND_DB_PORT: 5432
      AUDITMIND_DB_NAME: ${AUDITMIND_DB_NAME:-auditmind}
      AUDITMIND_DB_USER: ${AUDITMIND_DB_USER:-auditmind}
      AUDITMIND_DB_PASSWORD: ${AUDITMIND_DB_PASSWORD:-auditmind_dev_password}
      AUDITMIND_CURRENT_USER_ID: ${AUDITMIND_CURRENT_USER_ID:-system}
      AUDITMIND_PADDLE_OCR_PYTHON: /opt/paddleocr/bin/python
      AUDITMIND_PADDLE_OCR_VL_SERVER_URL: ${AUDITMIND_PADDLE_OCR_VL_SERVER_URL:-http://100.126.53.70:8118/v1}
      AUDITMIND_PADDLE_OCR_MODEL: ${AUDITMIND_PADDLE_OCR_MODEL:-PaddleOCR-VL-1.5-0.9B}
      PADDLE_PDX_CACHE_HOME: /workspace/.paddlex-cache
    ports:
      - "127.0.0.1:4174:4174"
    volumes:
      - .:/workspace
      - auditmind_api_node_modules:/workspace/node_modules
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: auditmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUDITMIND_DB_NAME:-auditmind}
      POSTGRES_USER: ${AUDITMIND_DB_USER:-auditmind}
      POSTGRES_PASSWORD: ${AUDITMIND_DB_PASSWORD:-auditmind_dev_password}
    ports:
      - "${AUDITMIND_DB_PORT:-5432}:5432"
    volumes:
      - auditmind_pgdata:/var/lib/postgresql/data
      - .:/workspace:ro
    working_dir: /workspace
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUDITMIND_DB_USER:-auditmind} -d ${AUDITMIND_DB_NAME:-auditmind}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auditmind_api_node_modules:
  auditmind_pgdata:
